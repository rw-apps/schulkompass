name: CI

on:
  pull_request:
  push:

# Nur lesen (Sicherheitsprüfung 03.11.26): Der Lauf braucht keine
# Schreibrechte, ein kompromittierter Schritt soll keine bekommen.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Generate l10n
        run: dart run intl_utils:generate

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: App unit and widget tests
        run: flutter test
